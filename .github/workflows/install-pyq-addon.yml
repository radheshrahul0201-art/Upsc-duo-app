name: Install UPSC Duo PYQ add-on

on:
  push:
    paths:
      - 'pyq-addon.js'
      - '.github/workflows/install-pyq-addon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link PYQ add-on
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="pyq-addon.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no </body> tag')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
              print('PYQ add-on linked')
          else:
              print('PYQ add-on already linked')
          PY
      - name: Commit updated index
        run: |
          if git diff --quiet; then
            echo 'No index change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load 2026 GS and CSAT PYQ add-on'
          git push
